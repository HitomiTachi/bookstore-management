<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sách - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    📚 BookStore
                </a>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Trang Chủ</a>
                    <a href="cart.html" class="nav-link">
                        🛒 Giỏ Hàng (<span id="cart-count">0</span>)
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <a href="index.html" class="back-link">← Quay lại danh sách</a>

            <div id="book-detail" class="book-detail">
                <!-- Book detail sẽ được render bởi JavaScript -->
            </div>

            <div id="not-found" class="no-results" style="display: none;">
                <p>😕 Không tìm thấy sách.</p>
                <a href="index.html" class="btn btn-primary">Về trang chủ</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 BookStore. Made with ❤️ by Team.</p>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // ============================================
        // BOOK DETAIL PAGE
        // Khu vực dễ CONFLICT: format giá, layout, nút
        // ============================================

        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const bookId = parseInt(params.get('id'));
            const book = books.find(b => b.id === bookId);

            if (!book) {
                document.getElementById('not-found').style.display = 'block';
                return;
            }

            document.title = book.title + ' - BookStore';

            const detailHTML = `
                <div class="detail-card">
                    <div class="detail-image">
                        <div class="book-cover-large">${book.emoji || '📖'}</div>
                    </div>
                    <div class="detail-info">
                        <h1 class="detail-title">${book.title}</h1>
                        <p class="detail-author">✍️ ${book.author}</p>
                        <span class="badge badge-${book.category}">${book.categoryName}</span>
                        <p class="detail-description">${book.description}</p>
                        <div class="detail-price">${book.price.toLocaleString('vi-VN')}đ</div>
                        <div class="detail-actions">
                            <button class="btn btn-primary btn-large" onclick="addToCart(${book.id})">
                                🛒 Thêm vào giỏ hàng
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('book-detail').innerHTML = detailHTML;
            updateCartCount();
        });
    </script>
</body>

</html>
